[project]
name = "onramp"
version = "0.1.0"
description = "Serverless RAG assistant over Adobe Real-Time CDP documentation"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR2004"]  # magic numbers are fine in tests and dimension constants

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0913"]
